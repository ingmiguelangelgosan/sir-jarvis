[Service]
# These hooks DENY only. They never start Jarvis, resolve DNS or authorize traffic.
# Install only after reviewing the existing daemon unit and legacy deny service.
ExecStartPre=/usr/bin/node /opt/sir-jarvis/deploy/egress/host.mjs deny
ExecStartPost=/usr/bin/node /opt/sir-jarvis/deploy/egress/host.mjs deny
